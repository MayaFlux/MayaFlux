name: Bug report (project created with Weave)
description: A crash, graphics, audio or build problem in a project created with Weave
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Two steps give us what we need to reproduce the problem. Both scripts are included in every project that Weave creates. If possible, build your project first, then run them from the project folder. If the build fails, include its output in the report.

        **1. Run the project check**

        Linux and macOS: `./validate.sh`

        Windows: `.\validate.bat`

        **2. Run the report script**

        Linux and macOS: `./run-report.sh`

        Windows: `.\run-report.bat`

        It runs your project with the report configuration that ships with MayaFlux, which turns on the Vulkan validation layers and writes a complete log. Reproduce the problem, then close the application. The script saves `mayaflux_run.txt` in the project folder, and the application writes `data/log/mayaflux_report.log`. Earlier logs are kept with a `.previous-` suffix, so each run is separate.

        If you have more than one build configuration, add `--configuration Debug` on Linux and macOS, or `-Configuration Debug` on Windows. For a custom build layout, add `--executable path/to/program`, or `-Executable path\to\program.exe` on Windows.

        The log records everything, so it can be large. Zip it if needed, then drag both files into the logs box below. If your project has no `run-report` script, it was created with an older Weave. Say so in the issue and attach the output of `validate` and your console output.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MayaFlux version and channel
      description: For example 0.5.0 stable, or 0.5.0-dev.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Arch Linux
        - Fedora
        - Ubuntu
        - macOS (Apple Silicon)
        - Windows
        - Other Linux
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and driver
      description: Optional but useful for graphics problems, for example RTX 3050 Laptop, driver 580.
  - type: textarea
    id: validate
    attributes:
      label: Output of the project check
      description: Paste everything `validate` printed.
      render: text
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Your project's mayaflux.json
      description: Only if your project has one. Paste its contents.
      render: json
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Attach `data/log/mayaflux_report.log` and `mayaflux_run.txt` if they were generated. For build failures, attach the build output instead. If the program crashed, also paste the last lines of `mayaflux_run.txt`.
    validations:
      required: true
