name: "Prune cache"
description: "Delete older cache entries with a prefix on this ref, once the entry to keep exists"

inputs:
  prefix:
    description: "Key prefix of the entries"
    required: true
  keep:
    description: "Key that was just saved"
    required: true

runs:
  using: composite
  steps:
    - name: Delete older entries
      continue-on-error: true
      uses: actions/github-script@v7
      env:
        PREFIX: ${{ inputs.prefix }}
        KEEP: ${{ inputs.keep }}
      with:
        script: |
          const { owner, repo } = context.repo;
          const { data } = await github.rest.actions.getActionsCacheList({
            owner, repo, key: process.env.PREFIX, ref: context.ref, per_page: 100,
          });
          const kept = data.actions_caches.find((entry) => entry.key === process.env.KEEP);
          if (!kept) {
            core.info('The new entry is not there. Nothing deleted.');
            return;
          }
          for (const entry of data.actions_caches) {
            if (entry.id !== kept.id && entry.created_at < kept.created_at) {
              await github.rest.actions.deleteActionsCacheById({ owner, repo, cache_id: entry.id });
              core.info(`Deleted ${entry.key}`);
            }
          }
