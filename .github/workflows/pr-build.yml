name: PR Build Check

on:
  workflow_dispatch:
    inputs:
      macos:
        description: "Build macOS"
        type: boolean
        default: true
      linux:
        description: "Build Linux"
        type: boolean
        default: true
      windows:
        description: "Build Windows"
        type: boolean
        default: true
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  build_macos:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.macos }}
    uses: ./.github/workflows/build-macos.yml
    with:
      version: "pr-${{ github.event.pull_request.number }}"
      clean_version: "0.0.0"
      is_dev: "1"
      run_tests: false
      create_distribution: false

  build_linux:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.linux }}
    uses: ./.github/workflows/build-linux.yml
    with:
      version: "pr-${{ github.event.pull_request.number }}"
      clean_version: "0.0.0"
      is_dev: "1"
      run_tests: false
      create_distribution: false
      artifact_name: "pr-${{ github.event.pull_request.number }}-linux"
      distribution_name: linux-fedora43-x64
      os_display_name: Linux

  build_windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows }}
    uses: ./.github/workflows/build-windows.yml
    with:
      version: "pr-${{ github.event.pull_request.number }}"
      clean_version: "0.0.0"
      is_dev: "1"
      run_tests: false
      create_distribution: false
      artifact_name: "pr-${{ github.event.pull_request.number }}-windows"
      distribution_name: windows-x64
      os_display_name: Windows
