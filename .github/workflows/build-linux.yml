name: "Build Linux Distribution"

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      clean_version:
        required: true
        type: string
      preset:
        required: false
        type: string
        default: linux-ship
      is_dev:
        required: false
        type: string
      run_tests:
        required: false
        type: boolean
        default: false
      test_preset:
        required: false
        type: string
        default: ''
      create_distribution:
        required: false
        type: boolean
        default: true
      artifact_name:
        required: true
        type: string
      distribution_name:
        required: true
        type: string
      os_display_name:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
      options: --privileged
    name: "Fedora 44 (GCC 16, LLVM 22)"

    steps:
      - name: Use version
        run: echo "Version is ${{ inputs.version }}"

      - name: Enable copr
        run: |
          dnf install -y dnf-plugins-core
          dnf copr enable -y ranjithshegde/spirv-cross
          dnf copr enable -y ranjithshegde/asio-standalone

      - name: Install build dependencies
        run: |
          echo "=== Installing Build Dependencies via DNF ==="
          dnf install -y \
            @development-tools \
            llvm llvm-devel llvm-libs \
            clang clang-devel \
            cmake \
            pkgconfig \
            glm-devel \
            eigen3-devel \
            spirv-headers-devel \
            spirv-cross-devel \
            spirv-tools-devel \
            vulkan-headers \
            vulkan-loader \
            vulkan-loader-devel \
            vulkan-tools \
            vulkan-validation-layers \
            ffmpeg-free-devel \
            assimp-devel \
            alembic-devel \
            stb-devel \
            tbb-devel \
            gtest-devel \
            glslc \
            libshaderc-devel \
            hidapi-devel \
            asio-standalone \
            utf8proc-devel \
            freetype-devel \
            fontconfig-devel \
            json-devel \
            pugixml-devel \
            ninja-build \
            mold \
            wayland-devel \
            wayland-protocols-devel \
            libxkbcommon-devel \
            pipewire-devel \
            alsa-lib-devel \
            dbus-devel \
            ccache \
            git

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: ${{ inputs.run_tests && inputs.test_preset != '' }}

      - name: Compiler cache
        uses: ./.github/actions/ccache
        with:
          key: fedora-${{ inputs.preset }}
          preset: ${{ inputs.preset }}

      - name: Build and test
        uses: ./.github/actions/build-and-test
        with:
          preset: ${{ inputs.preset }}
          run_tests: ${{ inputs.run_tests }}
          test_preset: ${{ inputs.test_preset }}

      - name: Install to staging directory
        if: ${{ inputs.create_distribution != false }}
        run: |
          mkdir -p dist_staging
          cmake --install build --prefix dist_staging

      - name: Verify version file
        if: ${{ inputs.create_distribution != false }}
        run: |
          echo "=== Version Metadata ==="
          if [ -f "dist_staging/share/MayaFlux/.version" ]; then
            cat dist_staging/share/MayaFlux/.version
          else
            echo "WARNING: .version file not generated!"
          fi

      - name: Verify installation structure
        if: ${{ inputs.create_distribution != false }}
        run: |
          echo "=== MayaFlux Distribution Structure ==="
          echo "MayaFluxLib (Core Library):"
          find dist_staging/include/MayaFlux -name "*.hpp" | head -5 || echo "No MayaFlux headers found"
          find dist_staging/lib -name "*MayaFlux*" | head -5 || echo "No MayaFlux libraries found"

          echo ""
          echo "Lila (JIT Interface):"
          find dist_staging/include/Lila -name "*.hpp" | head -5 || echo "No Lila headers found"
          find dist_staging/lib -name "*Lila*" | head -5 || echo "No Lila libraries found"

          echo ""
          echo "lila_server (User Executable):"
          find dist_staging/bin -name "*lila_server*" | head -5 || echo "No lila_server found"

          echo ""
          echo "Runtime (JIT Context):"
          find dist_staging/share/MayaFlux/runtime -type f | head -5 || echo "No runtime files found"

      - name: Copy distribution files
        if: ${{ inputs.create_distribution != false }}
        run: |
          cp .github/workflows/distribution/linux/verify_components.sh dist_staging/ || true
          chmod +x dist_staging/verify_components.sh 2>/dev/null || true

      - name: Create distribution packages with checksums
        if: ${{ inputs.create_distribution != false }}
        run: |
          VERSION="${{ inputs.version }}"
          SHORT_SHA=${GITHUB_SHA:0:8}
          OS_NAME="${{ inputs.distribution_name }}"
          PACKAGE_NAME="MayaFlux-${VERSION}-${OS_NAME}"

          tar -czf "${PACKAGE_NAME}.tar.gz" -C dist_staging .
          sha256sum "${PACKAGE_NAME}.tar.gz" > "${PACKAGE_NAME}.tar.gz.sha256"
          md5sum "${PACKAGE_NAME}.tar.gz" > "${PACKAGE_NAME}.tar.gz.md5"

          echo ""
          echo "SHA256 Checksums:"
          cat "${PACKAGE_NAME}.tar.gz.sha256"

          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> $GITHUB_ENV

      - name: Upload MayaFlux distribution
        if: ${{ inputs.create_distribution != false }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            ${{ env.PACKAGE_NAME }}.tar.gz
            ${{ env.PACKAGE_NAME }}.tar.gz.sha256
            ${{ env.PACKAGE_NAME }}.tar.gz.md5
          retention-days: 30

      - name: Display build summary
        if: ${{ inputs.create_distribution != false }}
        run: |
          echo "=== MayaFlux Linux Build Complete ==="
          echo "📦 Package: ${{ env.PACKAGE_NAME }}"
          echo "  Platform: ${{ inputs.os_display_name }}"
          echo "  Base: Fedora 43"
          echo "  Compiler: GCC $(gcc -dumpversion)"
          echo "  LLVM: $(llvm-config --version)"
          echo "  C++ Standard: C++23"
          echo ""
          echo "Dependencies:"
          echo "  ✓ LLVM 21 (Lila JIT)"
          echo "  ✓ GCC 15 (full C++23)"
          echo "  ✓ FFmpeg"
          echo "  ✓ Vulkan SDK, SPIR-V"
          echo "  ✓ Eigen3, GLM, fmt, TBB, STB"
          echo ""
          echo "Distribution Packages:"
          echo "  ✓ ${{ env.PACKAGE_NAME }}.tar.gz (with SHA256/MD5)"

      - name: Upload build logs
        if: failure()
        uses: ./.github/actions/upload-build-logs
        with:
          name: build-logs-linux
