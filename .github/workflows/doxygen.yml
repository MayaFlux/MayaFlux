name: Generate Doxygen Documentation

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:
    # push:
    #   branches:
    #     - main

permissions:
  contents: read

jobs:
  should_run:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for commits in last 24 hours
        id: check
        run: |
          CHANGES=$(git log --oneline --since="24 hours ago" origin/main)
          if [ -n "$CHANGES" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

  build-docs:
    needs: should_run
    if: ${{ needs.should_run.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/build-docs.yml

  deploy-pages:
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download documentation
        uses: actions/download-artifact@v4
        with:
          path: docs_artifact
          pattern: MayaFlux-*-docs

      - name: Extract documentation
        run: |
          mkdir -p site
          tar -xzf docs_artifact/*/MayaFlux-*-docs.tar.gz -C site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
